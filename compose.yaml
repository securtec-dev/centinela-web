name: centinela-web
services:
  web:
    image: centinela-comercial:local
    build: .
    environment:
      CENTINELA_WEB_BIND: 0.0.0.0
      CENTINELA_WEB_PORT: 8080
      CENTINELA_WEB_ADMIN_USER: ${CENTINELA_WEB_ADMIN_USER:?Set CENTINELA_WEB_ADMIN_USER in .env}
      CENTINELA_WEB_ADMIN_PASSWORD: ${CENTINELA_WEB_ADMIN_PASSWORD:?Set CENTINELA_WEB_ADMIN_PASSWORD in .env}
      CENTINELA_WEB_PUBLIC_ORIGINS: ${CENTINELA_WEB_PUBLIC_ORIGINS:-http://localhost:8080}
      CENTINELA_WEB_REQUIRE_HTTPS: ${CENTINELA_WEB_REQUIRE_HTTPS:-0}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - leads:/app/data
volumes:
  leads:
